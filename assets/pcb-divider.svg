<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 28" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      @keyframes traceFlow {
        0% { transform: translateX(-100px); }
        100% { transform: translateX(950px); }
      }
      .flow-packet {
        animation: traceFlow 3.5s linear infinite;
      }
    </style>
  </defs>
  <rect width="850" height="28" fill="#0A0E17"/>

  <!-- Center PCB bus tracks -->
  <line x1="20" y1="14" x2="830" y2="14" stroke="#162235" stroke-width="6"/>
  <line x1="20" y1="14" x2="830" y2="14" stroke="#00F0FF" stroke-width="2" opacity="0.6"/>

  <path d="M 60 7 L 180 7 L 190 14 L 320 14 L 330 7 L 550 7 L 560 14 L 780 14 L 790 7 L 810 7" fill="none" stroke="#BD93F9" stroke-width="2" opacity="0.5"/>
  <path d="M 40 21 L 120 21 L 130 14 L 250 14 L 260 21 L 460 21 L 470 14 L 680 14 L 690 21 L 820 21" fill="none" stroke="#39FF14" stroke-width="2" opacity="0.4"/>

  <!-- Soldering pads / Vias -->
  <rect x="20" y="11" width="6" height="6" fill="#FFE600"/>
  <rect x="21" y="12" width="4" height="4" fill="#0A0E17"/>

  <rect x="60" y="4" width="6" height="6" fill="#00F0FF"/>
  <rect x="61" y="5" width="4" height="4" fill="#0A0E17"/>

  <rect x="180" y="4" width="6" height="6" fill="#BD93F9"/>
  <rect x="250" y="11" width="6" height="6" fill="#39FF14"/>

  <!-- Center Hex Chip via -->
  <g transform="translate(425, 14)">
    <rect x="-12" y="-9" width="24" height="18" fill="#0F1726" stroke="#00F0FF" stroke-width="2"/>
    <rect x="-8" y="-5" width="16" height="10" fill="#00F0FF" opacity="0.3"/>
    <circle cx="0" cy="0" r="2" fill="#FFE600"/>
  </g>

  <rect x="600" y="11" width="6" height="6" fill="#39FF14"/>
  <rect x="720" y="4" width="6" height="6" fill="#00F0FF"/>
  <rect x="830" y="11" width="6" height="6" fill="#FFE600"/>
  <rect x="831" y="12" width="4" height="4" fill="#0A0E17"/>

  <!-- Moving Data Packet (Animated) -->
  <g class="flow-packet">
    <rect x="0" y="12" width="12" height="4" fill="#FFE600"/>
    <rect x="12" y="13" width="8" height="2" fill="#FFFFFF"/>
    <rect x="-8" y="13" width="8" height="2" fill="#FF0055"/>
  </g>
</svg>