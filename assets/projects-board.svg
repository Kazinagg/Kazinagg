<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      }
      @keyframes pulseLed {
        0%, 100% { fill: #39FF14; }
        50% { fill: #008800; }
      }
      .online-led {
        animation: pulseLed 1.8s infinite steps(1);
      }
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect width="850" height="320" fill="#0A0E17"/>

  <!-- OUTER TERMINAL WINDOW -->
  <rect x="6" y="6" width="838" height="308" fill="#0D1321" stroke="#162235" stroke-width="4"/>
  <rect x="10" y="10" width="830" height="300" fill="none" stroke="#39FF14" stroke-width="2" opacity="0.6"/>

  <!-- WINDOW HEADER -->
  <rect x="12" y="12" width="826" height="28" fill="#162235"/>
  <line x1="12" y1="40" x2="838" y2="40" stroke="#39FF14" stroke-width="2"/>

  <text x="24" y="30" fill="#39FF14" font-size="12" font-weight="bold" letter-spacing="1" class="font-mono">
    ╔═ ACTIVE MISSIONS // DEPLOYED ARCHITECTURES
  </text>
  <text x="740" y="30" fill="#8892B0" font-size="12" class="font-mono">[STATUS: 3 OK]</text>

  <!-- MISSION CARD 1: MOODLE AI RAG -->
  <g transform="translate(24, 55)">
    <rect x="0" y="0" width="255" height="240" fill="#070D18" stroke="#00F0FF" stroke-width="2"/>
    <rect x="0" y="0" width="255" height="24" fill="#0F1F35"/>
    <circle cx="12" cy="12" r="3" fill="#39FF14" class="online-led"/>
    <text x="22" y="16" fill="#00F0FF" font-size="10" font-weight="bold" class="font-mono">MISSION 01 // AI PIPELINE</text>

    <text x="14" y="48" fill="#FFFFFF" font-size="14" font-weight="bold" class="font-mono">Moodle AI RAG</text>
    <text x="14" y="66" fill="#00F0FF" font-size="10" class="font-mono">Multi-Agent Cognitive Platform</text>

    <line x1="14" y1="76" x2="241" y2="76" stroke="#162235" stroke-width="2"/>

    <text x="14" y="98" fill="#A0AEC0" font-size="10" class="font-mono">Автоматизация обучения в</text>
    <text x="14" y="114" fill="#A0AEC0" font-size="10" class="font-mono">университетской среде. Полно-</text>
    <text x="14" y="130" fill="#A0AEC0" font-size="10" class="font-mono">связный RAG-пайплайн,</text>
    <text x="14" y="146" fill="#A0AEC0" font-size="10" class="font-mono">интеграция DeepSeek LLM &amp; MCP.</text>

    <g transform="translate(14, 162)">
      <rect x="0" y="0" width="64" height="18" fill="#141E30" stroke="#00F0FF" stroke-width="1"/>
      <text x="6" y="12" fill="#00F0FF" font-size="9" font-weight="bold" class="font-mono">DeepSeek</text>

      <rect x="70" y="0" width="46" height="18" fill="#141E30" stroke="#BD93F9" stroke-width="1"/>
      <text x="76" y="12" fill="#BD93F9" font-size="9" font-weight="bold" class="font-mono">MCP</text>

      <rect x="122" y="0" width="58" height="18" fill="#141E30" stroke="#39FF14" stroke-width="1"/>
      <text x="128" y="12" fill="#39FF14" font-size="9" font-weight="bold" class="font-mono">FastAPI</text>
    </g>

    <rect x="14" y="198" width="227" height="24" fill="#0F1726"/>
    <text x="24" y="214" fill="#39FF14" font-size="10" font-weight="bold" class="font-mono">▶ STATUS: RUNNING (PROD)</text>
  </g>

  <!-- MISSION CARD 2: INSTITUTE PLATFORM -->
  <g transform="translate(297, 55)">
    <rect x="0" y="0" width="255" height="240" fill="#070D18" stroke="#BD93F9" stroke-width="2"/>
    <rect x="0" y="0" width="255" height="24" fill="#1E1430"/>
    <circle cx="12" cy="12" r="3" fill="#39FF14" class="online-led"/>
    <text x="22" y="16" fill="#BD93F9" font-size="10" font-weight="bold" class="font-mono">MISSION 02 // WEB CORE</text>

    <text x="14" y="48" fill="#FFFFFF" font-size="14" font-weight="bold" class="font-mono">Institute Portal</text>
    <text x="14" y="66" fill="#BD93F9" font-size="10" class="font-mono">High-Load Faculty Platform</text>

    <line x1="14" y1="76" x2="241" y2="76" stroke="#162235" stroke-width="2"/>

    <text x="14" y="98" fill="#A0AEC0" font-size="10" class="font-mono">Разработка и сопровождение</text>
    <text x="14" y="114" fill="#A0AEC0" font-size="10" class="font-mono">официального ресурса института.</text>
    <text x="14" y="130" fill="#A0AEC0" font-size="10" class="font-mono">Сложная бэкенд-архитектура,</text>
    <text x="14" y="146" fill="#A0AEC0" font-size="10" class="font-mono">авторизация, сервисы и БД.</text>

    <g transform="translate(14, 162)">
      <rect x="0" y="0" width="56" height="18" fill="#141E30" stroke="#39FF14" stroke-width="1"/>
      <text x="6" y="12" fill="#39FF14" font-size="9" font-weight="bold" class="font-mono">Django</text>

      <rect x="62" y="0" width="48" height="18" fill="#141E30" stroke="#00F0FF" stroke-width="1"/>
      <text x="68" y="12" fill="#00F0FF" font-size="9" font-weight="bold" class="font-mono">React</text>

      <rect x="116" y="0" width="68" height="18" fill="#141E30" stroke="#FFE600" stroke-width="1"/>
      <text x="122" y="12" fill="#FFE600" font-size="9" font-weight="bold" class="font-mono">Postgres</text>
    </g>

    <rect x="14" y="198" width="227" height="24" fill="#0F1726"/>
    <text x="24" y="214" fill="#39FF14" font-size="10" font-weight="bold" class="font-mono">▶ STATUS: ONLINE (MAINTAIN)</text>
  </g>

  <!-- MISSION CARD 3: ESP32 & SUB-GHZ -->
  <g transform="translate(570, 55)">
    <rect x="0" y="0" width="255" height="240" fill="#070D18" stroke="#FFE600" stroke-width="2"/>
    <rect x="0" y="0" width="255" height="24" fill="#2E250A"/>
    <circle cx="12" cy="12" r="3" fill="#39FF14" class="online-led"/>
    <text x="22" y="16" fill="#FFE600" font-size="10" font-weight="bold" class="font-mono">MISSION 03 // IOT &amp; RF</text>

    <text x="14" y="48" fill="#FFFFFF" font-size="14" font-weight="bold" class="font-mono">ESP32 IoT &amp; RF</text>
    <text x="14" y="66" fill="#FFE600" font-size="10" class="font-mono">Smart Mesh &amp; Signal Reverse</text>

    <line x1="14" y1="76" x2="241" y2="76" stroke="#162235" stroke-width="2"/>

    <text x="14" y="98" fill="#A0AEC0" font-size="10" class="font-mono">Проектирование кастомных IoT</text>
    <text x="14" y="114" fill="#A0AEC0" font-size="10" class="font-mono">устройств для умного дома.</text>
    <text x="14" y="130" fill="#A0AEC0" font-size="10" class="font-mono">Реверс-инжиниринг Sub-GHz</text>
    <text x="14" y="146" fill="#A0AEC0" font-size="10" class="font-mono">радиопротоколов и интеграция.</text>

    <g transform="translate(14, 162)">
      <rect x="0" y="0" width="52" height="18" fill="#141E30" stroke="#39FF14" stroke-width="1"/>
      <text x="6" y="12" fill="#39FF14" font-size="9" font-weight="bold" class="font-mono">ESP32</text>

      <rect x="58" y="0" width="56" height="18" fill="#141E30" stroke="#FFE600" stroke-width="1"/>
      <text x="64" y="12" fill="#FFE600" font-size="9" font-weight="bold" class="font-mono">Sub-GHz</text>

      <rect x="120" y="0" width="85" height="18" fill="#141E30" stroke="#00F0FF" stroke-width="1"/>
      <text x="126" y="12" fill="#00F0FF" font-size="9" font-weight="bold" class="font-mono">HomeAssist</text>
    </g>

    <rect x="14" y="198" width="227" height="24" fill="#0F1726"/>
    <text x="24" y="214" fill="#FFE600" font-size="10" font-weight="bold" class="font-mono">▶ STATUS: LAB TESTING</text>
  </g>
</svg>